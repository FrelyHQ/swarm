services:
  snap:
    build: .
    ports:
      - "127.0.0.1:${SNAP_PORT:-8787}:8787"
    environment:
      PORT: "8787"
      FRELY_GATEWAY_URL: ${FRELY_GATEWAY_URL:-http://host.docker.internal:8080}
      SNAP_SWARM_URL: ${SNAP_SWARM_URL:-http://host.docker.internal:8788}
      SNAP_REQUIRE_SWARM: ${SNAP_REQUIRE_SWARM:-true}
      SNAP_MODEL: ${SNAP_MODEL:-default}
      SNAP_TIMEOUT_MS: ${SNAP_TIMEOUT_MS:-10000}
      GATEWAY_API_KEY_FILE: /run/secrets/gateway_api_key
      SWARM_PROBE_KEY_FILE: /run/secrets/swarm_probe_key
      GATEWAY_HOST: ${GATEWAY_HOST:-}
    secrets:
      - gateway_api_key
      - swarm_probe_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

secrets:
  gateway_api_key:
    file: ${SNAP_GATEWAY_SECRET_FILE:-./secrets/gateway_api_key}
  swarm_probe_key:
    file: ${SNAP_SWARM_SECRET_FILE:-./secrets/swarm_probe_key}
