name: frely-swarm-vision

services:
  swarm-vision:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SWARM_PORT:-4111}:4111"
    environment:
      NODE_ENV: production
      SWARM_HOST: 0.0.0.0
      PORT: "4111"
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_API_KEY_FILE: /run/secrets/model_api_key
      MODEL_NAME: ${MODEL_NAME:-gpt-5.6-luna}
      SWARM_PUBLIC_MODEL: ${SWARM_PUBLIC_MODEL:-vision-basic}
      SWARM_ACCESS_TOKEN_FILE: /run/secrets/swarm_access_token
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-120000}
      SWARM_ALLOW_INSECURE_MODEL_HTTP: ${SWARM_ALLOW_INSECURE_MODEL_HTTP:-false}
    secrets:
      - model_api_key
      - swarm_access_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4111/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

secrets:
  model_api_key:
    file: ${MODEL_API_KEY_SECRET_FILE:-./secrets/model_api_key}
  swarm_access_token:
    file: ${SWARM_ACCESS_TOKEN_SECRET_FILE:-./secrets/swarm_access_token}
