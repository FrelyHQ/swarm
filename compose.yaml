name: frely-swarm-vision

services:
  swarm-vision:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SWARM_PORT:-4111}:4111"
    environment:
      NODE_ENV: production
      SWARM_HOST: 0.0.0.0
      PORT: "4111"
      FRELY_BASE_URL: ${FRELY_BASE_URL:-http://gateway-srv:43000/v1}
      FRELY_API_KEY_FILE: /run/secrets/frely_api_key
      FRELY_MODEL: ${FRELY_MODEL:-dev-base}
      SWARM_PUBLIC_MODEL: ${SWARM_PUBLIC_MODEL:-vision-basic}
      SWARM_ACCESS_TOKEN_FILE: /run/secrets/swarm_access_token
      FRELY_TIMEOUT_MS: ${FRELY_TIMEOUT_MS:-120000}
    secrets:
      - frely_api_key
      - swarm_access_token
    networks:
      frely-dev:
        aliases:
          - frely-swarm-vision
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4111/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

secrets:
  frely_api_key:
    file: ${FRELY_API_KEY_SECRET_FILE:-../.local/frely-compose-dev/swarm-frely-api-key}
  swarm_access_token:
    file: ${SWARM_ACCESS_TOKEN_SECRET_FILE:-../.local/frely-compose-dev/swarm-access-token}

networks:
  frely-dev:
    name: ${FRELY_DEV_NETWORK:-frely-dev}
    external: true
