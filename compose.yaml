name: frely-snap-debug

services:
  snap-debug:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SNAP_PORT:-8787}:8080"
    environment:
      NODE_ENV: production
      SNAP_HOST: 0.0.0.0
      PORT: "8080"
      FRELY_GATEWAY_URL: ${FRELY_GATEWAY_URL:-http://host.docker.internal:43000}
      GATEWAY_API_KEY_FILE: /run/secrets/gateway_api_key
      GATEWAY_HOST: ${GATEWAY_HOST:-}
      SNAP_SWARM_URL: ${SNAP_SWARM_URL:-http://host.docker.internal:4111}
      SNAP_REQUIRE_SWARM: ${SNAP_REQUIRE_SWARM:-true}
      SNAP_ALLOW_INSECURE_HTTP: ${SNAP_ALLOW_INSECURE_HTTP:-false}
      SNAP_MODEL: ${SNAP_MODEL:-replace-with-enabled-model}
      SNAP_TIMEOUT_MS: ${SNAP_TIMEOUT_MS:-30000}
    secrets:
      - gateway_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Fixed runtime ceilings keep the checked-in Compose contract finite.
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

secrets:
  gateway_api_key:
    file: ${SNAP_GATEWAY_SECRET_FILE:-./secrets/gateway_api_key}
